name: 채용공고 수집

on:
  schedule:
    # GitHub 시계는 UTC(한국 -9시간). 실제 실행은 몇 분~수십 분 늦어질 수 있다.
    - cron: "17 23 * * *"   # 한국 오전 8시 17분
    - cron: "17 9 * * *"    # 한국 오후 6시 17분
  workflow_dispatch:         # Actions 탭에서 손으로 실행하는 버튼
    inputs:
      lookback_hours:
        description: "몇 시간 전 공고까지 가져올까? (첫 실행은 168 = 일주일 추천)"
        default: "36"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/collect.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours }}
